services:
  postgres:
    image: postgres:18
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbit_postgres_data:/var/lib/postgresql

volumes:
  orbit_postgres_data:
